[package]
name = "auto_props_proc_macros"
authors = ["orgrinrt", "Hiisi Digital"]
version = "0.1.0"
edition = "2021"
description = "The procedural macro implementation behind auto_props"
license = "MPL-2.0"
repository = "https://github.com/orgrinrt/auto_props"
homepage = "https://github.com/orgrinrt/auto_props"
documentation = "https://docs.rs/auto_props_proc_macros"
keywords = ["macro", "properties", "builder", "proc-macro"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
include_proc_macro = "2.0"
# Tracks `dev`, like every other cross-repo git dependency here. Without a branch it tracked
# `main`, whose manifest still requires derive_display 0.0.4 against a derive_display `main`
# carrying 0.0.5, so a fresh resolve could not pick a version and this crate's suite was red
# for a reason that had nothing to do with it.
ohelpers_proc_macros = { git = "https://github.com/orgrinrt/ohelpers_proc_macros.git", branch = "dev", version = "0.1" }
syn = "2.0.60"
proc-macro2 = "1.0.81"
quote = "1.0.35"

[features]
default = ["impl_with"]
impl_with = []
getter_prefix = []
