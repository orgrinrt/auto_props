[package]
name = "auto_props"
authors = ["orgrinrt", "Hiisi Digital"]
version = "0.1.0"
edition = "2021"
description = "A macro for implementing properties, optionally with builder-style methods, for the lazy."
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/orgrinrt/auto_props"
homepage = "https://github.com/orgrinrt/auto_props"
documentation = "https://docs.rs/auto_props"
keywords = ["macro", "properties", "builder", "getter", "setter"]
categories = ["rust-patterns", "development-tools"]

[dependencies]
# default-features = false, or the feature forwards below cannot turn anything
# off: the proc-macro crate carries impl_with in its own default set, so
# depending on that default re-enables it whatever a consumer asks for here.
auto_props_proc_macros = { path = "proc-macros", version = "0.1.0", default-features = false }
paste = "1.0.14"

[features]
default = ["impl_with"]
impl_with = ["auto_props_proc_macros/impl_with"]
getter_prefix = ["auto_props_proc_macros/getter_prefix"]
